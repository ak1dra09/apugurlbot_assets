<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>APUGURL Wallet</title>
  <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #304b0d; font: 18px Arial, sans-serif; color: white; }
    main { text-align: center; padding: 32px; }
    #ton-connect { display: inline-block; margin-top: 24px; }
    #status { margin-top: 24px; }
  </style>
</head>
<body>
  <main>
    <h1>APUGURL</h1>
    <p>Подключите TON-кошелёк</p>
    <div id="ton-connect"></div>
    <p id="status"></p>
  </main>
  <script>
    const token = new URLSearchParams(location.search).get("token");
    const status = document.getElementById("status");
    const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
      manifestUrl: "__MANIFEST_URL__",
      buttonRootId: "ton-connect"
    });

    tonConnectUI.onStatusChange(async (wallet) => {
      if (!wallet || !wallet.account || !wallet.account.address || !token) return;
      status.textContent = "Кошелёк подключён. Проверяем баланс...";
      const response = await fetch("/wallet-connected", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token, address: wallet.account.address })
      });
      const result = await response.json();
      status.textContent = result.ok ? "Кошелёк успешно привязан. Вернитесь в Telegram." : (result.error || "Ошибка подключения");
    });
  </script>
</body>
</html>
